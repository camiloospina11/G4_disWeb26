<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .container {
            display: grid;
            grid-template-rows: 100px 50px 100px 200px 50px;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        header {
            background-color: lightblue;
        }

        nav {
            background-color: lightgreen;
        }

        aside {
            background-color: lightcoral;
        }

        main {
            background-color: lightgoldenrodyellow;
        }

        footer {
            background-color: lightgray;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>Fila 1 Encabezado</header>
        <nav>Fila 2 Menú</nav>
        <aside>Fila 3 Aside</aside>
        <main>Fila 4 Main</main>
        <footer>Fila 5 Pie de página</footer>
    </div>
</body>
</html>
